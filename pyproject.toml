[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-pulse"
version = "1.2.0"
description = "Always-on-top desktop widget that monitors Claude Code usage in real time - quota meters, per-model/per-project breakdown, JARVIS-style voice alerts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pywebview>=5.0",
    "requests>=2.31",
    "edge-tts>=6.1",
    "pystray>=0.19",
    "pillow>=10.0",
]
keywords = ["claude", "claude-code", "anthropic", "usage", "quota", "widget"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/Masterjbrito/claude-pulse"

[project.scripts]
claude-pulse = "claude_pulse:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["claude_pulse.py", "ui/**"]

[tool.hatch.build.targets.wheel.force-include]
"ui" = "ui"
