name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile claude_pulse.py
      - name: Import & aggregate smoke test
        run: python -c "import claude_pulse as cp; api = cp.Api.__new__(cp.Api); import threading; api.store = cp.UsageStore(); api._limits=None; api._limits_ts=0; api.window=None; api.tray=None; api._update=None; s = api.get_stats(); assert 'today' in s and 'models' in s and 'weeks' in s, s.keys(); print('smoke OK', {k: s[k] for k in ('today','month','total')})"
